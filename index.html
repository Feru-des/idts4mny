<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>...</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Eliminación absoluta de bordes redondeados y efectos táctiles nativos */
        *, *::before, *::after {
            border-radius: 0px !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace, system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white w-screen h-[100dvh] relative overflow-hidden flex items-center justify-center cursor-pointer select-none">

    <!-- Indicador táctil inicial -->
    <div id="startPrompt" class="z-10 px-8 py-5 border border-zinc-800 bg-black text-center pointer-events-none">
        <p class="text-xs tracking-[0.25em] font-mono text-zinc-300 uppercase">TOCA LA PANTALLA</p>
    </div>

    <!-- Elemento de video con opacity-0 y muted inicial -->
    <video 
        id="loopVideo" 
        class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300 pointer-events-none"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto"
        src="https://files.catbox.moe/dafazz.mp4">
    </video>

    <script>
        const video = document.getElementById('loopVideo');
        const startPrompt = document.getElementById('startPrompt');

        function startPlayback() {
            // Intentar quitar silencio directamente en el gesto táctil
            video.muted = false;

            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Solo si la reproducción tuvo éxito se oculta el aviso y se bloquean eventos extra
                    if (startPrompt) startPrompt.remove();
                    video.classList.remove('opacity-0');
                    document.body.style.pointerEvents = 'none';

                    cleanupListeners();
                }).catch(function(error) {
                    console.warn("Intento con audio bloqueado en móvil, aplicando fallback:", error);

                    // Fallback para móviles con restricciones estrictas de audio
                    video.muted = true;
                    video.play().then(() => {
                        video.muted = false; // Activar audio justo tras el arranque
                        if (startPrompt) startPrompt.remove();
                        video.classList.remove('opacity-0');
                        document.body.style.pointerEvents = 'none';
                        cleanupListeners();
                    });
                });
            }
        }

        function cleanupListeners() {
            window.removeEventListener('click', startPlayback);
            window.removeEventListener('touchstart', startPlayback);
        }

        // Se registran 'click' y 'touchstart' directamente para asegurar compatibilidad móvil
        window.addEventListener('click', startPlayback);
        window.addEventListener('touchstart', startPlayback, { passive: true });
    </script>
</body>
</html>
