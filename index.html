<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Loop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Eliminación absoluta de bordes redondeados y efectos táctiles nativos */
        *, *::before, *::after {
            border-radius: 0px !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace, system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white w-screen h-[100dvh] relative overflow-hidden flex items-center justify-center cursor-pointer select-none">

    <!-- Indicador táctil inicial -->
    <div id="startPrompt" class="z-10 px-8 py-5 border border-zinc-800 bg-black text-center pointer-events-none">
        <p class="text-xs tracking-[0.25em] font-mono text-zinc-300 uppercase">TOCA LA PANTALLA</p>
    </div>

    <!-- Elemento de video con opacity-0 en lugar de hidden y con muted inicial para precarga -->
    <video 
        id="loopVideo" 
        class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300 pointer-events-none"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto"
        src="https://files.catbox.moe/1eevl7.mp4">
    </video>

    <script>
        const video = document.getElementById('loopVideo');
        const startPrompt = document.getElementById('startPrompt');

        function handleFirstTouch() {
            // 1. Desactivar el silencio
            video.muted = false;

            // 2. Intentar reproducir el vídeo dentro del gesto del usuario
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Muestra el vídeo y quita el aviso solo si la reproducción comenzó con éxito
                    startPrompt.remove();
                    video.classList.remove('opacity-0');
                }).catch(function(error) {
                    console.error("Error al iniciar la reproducción:", error);
                });
            }

            // 3. Inhabilitar interacciones posteriores
            document.body.style.pointerEvents = 'none';
        }

        // Se usa 'pointerdown' para unificar eventos táctiles y de clic sin perder la activación del usuario
        window.addEventListener('pointerdown', handleFirstTouch, { once: true });
    </script>
</body>
</html>
