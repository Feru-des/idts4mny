<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>...</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Eliminación absoluta de bordes redondeados y efectos táctiles nativos */
        *, *::before, *::after {
            border-radius: 0px !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace, system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white w-screen h-[100dvh] relative overflow-hidden flex items-center justify-center cursor-pointer select-none">

    <!-- Indicador táctil inicial ultra minimalista sin esquinas redondeadas -->
    <div id="startPrompt" class="z-10 px-8 py-5 border border-zinc-800 bg-black text-center">
        <p class="text-xs tracking-[0.25em] font-mono text-zinc-300 uppercase">TOCA LA PANTALLA</p>
    </div>

    <!-- Elemento de video configurado para llenar la pantalla y sin controles -->
    <video 
        id="loopVideo" 
        class="absolute inset-0 w-full h-full object-cover hidden pointer-events-none"
        playsinline
        webkit-playsinline
        loop
        preload="auto"
        src="https://files.catbox.moe/1eevl7.mp4">
    </video>

    <script>
        const video = document.getElementById('loopVideo');
        const startPrompt = document.getElementById('startPrompt');

        // Función ejecutada únicamente en el primer toque/clic
        function handleFirstTouch(e) {
            if (e) e.preventDefault();

            // 1. Desaparece la pantalla inicial
            startPrompt.remove();

            // 2. Muestra el reproductor
            video.classList.remove('hidden');

            // 3. Activa el sonido (unmuted)
            video.muted = false;

            // 4. Inicia la reproducción en bucle
            video.play().catch(function(error) {
                console.error("Error al iniciar la reproducción:", error);
            });

            // 5. Inhabilita interacciones táctiles posteriores para evitar pausar o alterar la reproducción
            document.body.style.pointerEvents = 'none';

            // Elimina los escuchadores de eventos
            window.removeEventListener('click', handleFirstTouch);
            window.removeEventListener('touchstart', handleFirstTouch);
        }

        // Se registra el primer evento táctil o de clic
        window.addEventListener('click', handleFirstTouch, { once: true });
        window.addEventListener('touchstart', handleFirstTouch, { once: true, passive: false });
    </script>
</body>
</html>
